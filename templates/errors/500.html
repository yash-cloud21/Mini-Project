{% extends "base.html" %}

{% block title %}Internal Server Error{% endblock %}

{% block content %}
<div class="empty-state" style="padding: 60px 20px; text-align: center;">
    <i data-lucide="alert-triangle" style="width: 64px; height: 64px; color: var(--danger, #ef4444); margin-bottom: 24px;"></i>
    <h1 style="font-size: 2.5rem; margin-bottom: 12px;">500</h1>
    <h2 style="margin-bottom: 16px;">Internal Server Error</h2>
    <p class="text-muted" style="max-width: 400px; margin: 0 auto 32px;">
        Oops! Something went wrong on our end. We're looking into it. Please try again later.
    </p>
    <a href="{{ url_for('main.home') }}" class="btn btn-primary">Return Home</a>
</div>
{% endblock %}
