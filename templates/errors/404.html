{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="empty-state" style="padding: 60px 20px; text-align: center;">
    <i data-lucide="compass" style="width: 64px; height: 64px; color: var(--text-muted); margin-bottom: 24px;"></i>
    <h1 style="font-size: 2.5rem; margin-bottom: 12px;">404</h1>
    <h2 style="margin-bottom: 16px;">Page Not Found</h2>
    <p class="text-muted" style="max-width: 400px; margin: 0 auto 32px;">
        Oops! The page you are looking for doesn't exist, has been moved, or you might not have access to it.
    </p>
    <a href="{{ url_for('main.home') }}" class="btn btn-primary">Return Home</a>
</div>
{% endblock %}
